[pytest]
testpaths = .
addopts = -ra --tb=short -p no:cacheprovider
markers =
    root: needs Magisk root on the device
    slow: launches other apps or restarts things
    perf: frame-time measurements (scripts/perf-gate)
    real_remote: needs a press of the real Fire remote (P69); skipped unless GLASS_REAL_REMOTE=1
    stick: needs the real Fire TV; skipped on the emulator
