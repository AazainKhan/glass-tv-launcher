[package]
name = "glassimg"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Glass's native image kernels (backdrop colour matrices), called through JNI"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
